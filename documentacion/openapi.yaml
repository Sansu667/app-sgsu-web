  /api/solicitudes:
    get:
      tags:
      - Solicitudes
      summary: Listar solicitudes
      description: 'El listado se acota según el rol de quien consulta: el **cliente** ve solo las suyas,
        el **técnico** solo las que tiene asignadas y el **administrador** las ve todas. Los filtros `idUsuario`
        e `idTecnico` solo tienen efecto para el administrador.'
      security:
      - tokenBearer: []
      parameters:
      - name: estado
        in: query
        required: false
        description: Filtra por estado.
        schema:
          type: string
          enum:
          - registrada
          - asignada
          - en_proceso
          - resuelta
          - cerrada
          - cancelada
      - name: prioridad
        in: query
        required: false
        description: Filtra por prioridad.
        schema:
          type: string
          enum:
          - baja
          - media
          - alta
      - name: idServicio
        in: query
        required: false
        description: Filtra por servicio del catálogo.
        schema:
          type: integer
        example: 2
      - name: idUsuario
        in: query
        required: false
        description: Filtra por cliente (solo administrador).
        schema:
          type: integer
        example: 4
      - name: idTecnico
        in: query
        required: false
        description: Filtra por técnico (solo administrador).
        schema:
          type: integer
        example: 2
      - name: desde
        in: query
        required: false
        description: Fecha inicial de creación, AAAA-MM-DD.
        schema:
          type: string
        example: '2026-09-01'
      - name: hasta
        in: query
        required: false
        description: Fecha final de creación, AAAA-MM-DD.
        schema:
          type: string
        example: '2026-09-30'
      - name: pagina
        in: query
        required: false
        description: Número de página; por defecto 1.
        schema:
          type: integer
        example: 1
      - name: tamano
        in: query
        required: false
        description: Registros por página; entre 1 y 100, por defecto 20.
        schema:
          type: integer
        example: 20
      responses:
        '200':
          description: Listado de solicitudes.
          content:
            application/json:
              example:
                exito: true
                total: 3
                pagina: 1
                tamano: 20
                solicitudes:
                - id: 4
                  codigo: SOL-2026-0004
                  descripcion: No abre el correo corporativo desde el lunes.
                  direccion: 'Carrera 45 #12-30, Medellín'
                  prioridad: alta
                  estado: registrada
                  fecha_creacion: '2026-09-17 23:45:02'
                  fecha_programada: null
                  fecha_cierre: null
                  observacion_cierre: null
                  id_usuario: 4
                  cliente: Ana Gómez Rivera
                  id_servicio: 2
                  servicio: Soporte técnico remoto
                  categoria: Soporte
                  precio_base: 60000
                  id_tecnico: null
                  tecnico: null
        '401':
          description: Token ausente o inválido.
          content:
            application/json:
              example:
                exito: false
                mensaje: 'Acceso no autorizado: falta el token de autenticación.'
    post:
      tags:
      - Solicitudes
      summary: Registrar una solicitud
      description: Solo el rol **cliente**. El código de la solicitud lo genera la API de forma consecutiva
        (SOL-AAAA-0000) y el primer movimiento queda registrado en la bitácora automáticamente.
      security:
      - tokenBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              idServicio: 2
              descripcion: No abre el correo corporativo desde el lunes.
              direccion: 'Carrera 45 #12-30, Medellín'
              prioridad: alta
              fechaProgramada: '2026-09-25'
      responses:
        '201':
          description: Solicitud registrada.
          content:
            application/json:
              example:
                exito: true
                mensaje: Solicitud registrada correctamente.
                solicitud:
                  id: 4
                  codigo: SOL-2026-0004
                  descripcion: No abre el correo corporativo desde el lunes.
                  direccion: 'Carrera 45 #12-30, Medellín'
                  prioridad: alta
                  estado: registrada
                  fecha_creacion: '2026-09-17 23:45:02'
                  fecha_programada: null
                  fecha_cierre: null
                  observacion_cierre: null
                  id_usuario: 4
                  cliente: Ana Gómez Rivera
                  id_servicio: 2
                  servicio: Soporte técnico remoto
                  categoria: Soporte
                  precio_base: 60000
                  id_tecnico: null
                  tecnico: null
        '400':
          description: Datos inválidos.
          content:
            application/json:
              example:
                exito: false
                mensaje: Los datos enviados no son válidos.
                errores:
                - La descripción del caso es obligatoria y debe tener al menos 10 caracteres.
        '403':
          description: El rol no tiene permiso.
          content:
            application/json:
              example:
                exito: false
                mensaje: 'Acceso denegado: esta operación solo está permitida para el rol cliente.'
        '404':
          description: El servicio no existe.
          content:
            application/json:
              example:
                exito: false
                mensaje: El servicio indicado no existe en el catálogo.
        '409':
          description: El servicio está desactivado.
          content:
            application/json:
              example:
                exito: false
                mensaje: El servicio indicado está desactivado y no admite solicitudes nuevas.
