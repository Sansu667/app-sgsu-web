  /api/solicitudes/{id}/estado:
    patch:
      tags:
      - Solicitudes
      summary: Cambiar el estado de una solicitud
      description: 'Avanza el estado respetando el flujo definido:


        `registrada → asignada → en_proceso → resuelta → cerrada`


        Desde cualquier estado abierto se puede pasar a `cancelada`, y desde `resuelta` se puede devolver
        a `en_proceso` si el trabajo quedó incompleto. El técnico solo puede mover las solicitudes que
        tiene asignadas y no puede cerrarlas: el cierre lo hace el administrador.'
      security:
      - tokenBearer: []
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador de la solicitud.
        schema:
          type: integer
        example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              estado: en_proceso
              comentario: Se inicia la revisión remota.
      responses:
        '200':
          description: Estado cambiado.
          content:
            application/json:
              example:
                exito: true
                mensaje: La solicitud pasó de "asignada" a "en_proceso".
                solicitud:
                  id: 4
                  codigo: SOL-2026-0004
                  descripcion: No abre el correo corporativo desde el lunes.
                  direccion: 'Carrera 45 #12-30, Medellín'
                  prioridad: alta
                  estado: en_proceso
                  fecha_creacion: '2026-09-17 23:45:02'
                  fecha_programada: null
                  fecha_cierre: null
                  observacion_cierre: null
                  id_usuario: 4
                  cliente: Ana Gómez Rivera
                  id_servicio: 2
                  servicio: Soporte técnico remoto
                  categoria: Soporte
                  precio_base: 60000
                  id_tecnico: null
                  tecnico: null
        '400':
          description: Falta el estado nuevo.
          content:
            application/json:
              example:
                exito: false
                mensaje: El estado nuevo es obligatorio.
        '403':
          description: No está asignada al técnico, o el técnico intenta cerrarla.
          content:
            application/json:
              example:
                exito: false
                mensaje: 'Acceso denegado: esta solicitud no está asignada a usted.'
        '404':
          description: No existe.
          content:
            application/json:
              example:
                exito: false
                mensaje: No existe una solicitud con ese identificador.
        '409':
          description: Transición no permitida.
          content:
            application/json:
              example:
                exito: false
                mensaje: 'No se puede pasar de "registrada" a "resuelta". Desde "registrada" solo se permite:
                  asignada, cancelada.'
